spring.application.name=hfx-connect-backend

# Database connection. Defaults match docker-compose.yml's local development
# defaults, so `docker compose up -d` plus `./mvnw spring-boot:run` works with no
# extra configuration. Override via real environment variables (see .env.example)
# for any non-default setup.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hfx_connect}
spring.datasource.username=${DB_USERNAME:hfx_connect}
spring.datasource.password=${DB_PASSWORD:hfx_connect_dev_password}

# Flyway is the sole authority for schema changes; migrations run on startup via
# com.hfxconnect.common.config.FlywayMigrationConfig (Spring Boot 4.1 does not
# ship built-in Flyway auto-configuration, so it is configured explicitly).
# Hibernate never creates or alters the schema (ddl-auto=validate): it only
# checks that entity mappings match what Flyway already created, and fails
# fast at startup if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Expose only the health endpoint, and only a plain UP/DOWN status to
# unauthenticated requests. Component-level detail (which can reveal
# infrastructure information) is reserved for authorized requests once
# authentication exists (Milestone 5C).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Origins allowed to call /api/v1/** directly from a browser (see
# com.hfxconnect.common.config.WebCorsConfig). Defaults to the frontend's own
# local dev origin; override per-environment via CORS_ALLOWED_ORIGINS, never
# with a "*" wildcard.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Access-token signing (com.hfxconnect.auth.AccessTokenService) and refresh-
# session lifetime (com.hfxconnect.auth.RefreshSessionService) — see
# ADR-008. Deliberately NO fallback default here, unlike DB_PASSWORD/
# CORS_ALLOWED_ORIGINS above: a default password or CORS origin is a
# convenience with low real-world risk (a real production database has its
# own required credentials regardless of what this file says), but a JWT
# signing secret with a working fallback is a latent authentication bypass —
# if a real deployment ever forgot to set JWT_SECRET, it would silently start
# up and sign tokens with a secret published in this public repository's
# history, letting anyone who reads the source code forge valid access
# tokens undetected. JWT_SECRET must therefore be set explicitly in every
# environment, including local development (see backend/.env.example) — if
# it is missing, Spring fails to resolve this placeholder and the
# application refuses to start, with a clear error naming the missing
# property, rather than ever running with a known secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:hfx-connect}
# 15 minutes.
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL:900}
# 30 days.
app.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TOKEN_TTL:2592000}

# Refresh-cookie policy (com.hfxconnect.auth.RefreshCookieConfig) — see
# ADR-008's "Cookie Policy" section for why Secure/SameSite must differ
# between local development (same-site, plain HTTP) and this project's real
# cross-site production deployment (Vercel frontend / Render backend — see
# ADR-006). Local defaults below are correct for local dev only; production
# must set AUTH_COOKIE_SECURE=true and AUTH_COOKIE_SAME_SITE=None.
app.auth.cookie.path=/api/v1/auth
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
